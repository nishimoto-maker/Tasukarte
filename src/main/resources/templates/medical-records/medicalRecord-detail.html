<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>診療記録詳細</title>
	<!-- 仮置きCSS -->
	<style>
		body {
			font-family: sans-serif;
			margin: 20px;
			color: #222;
		}
		.top-nav {
			display: flex;
			gap: 12px;
			margin-bottom: 16px;
		}
		table {
			border-collapse: collapse;
			width: 100%;
		}
		th, td {
			border: 1px solid #333;
			padding: 6px 10px;
			vertical-align: top;
		}
		th {
			background-color: #f4f6f8;
			text-align: left;
		}
		/* 見出し用の行（Subjectや処置の名前部分） */
		.label-row td {
			height: 24px;
			font-size: 13px;
			font-weight: bold;
			background-color: #fafafa;
		}
		/* 閲覧スペース用の行 */
		.value-row td {
			min-height: 80px;
		}
		/* レイアウト全体 */
		.medicalRecord-viewer {
			display: flex;
			gap: 20px;
			align-items: flex-start;
		}
		/* 左サイドバー（左上：患者情報 / 左下：他の診療記録一覧） */
		.sidebar {
			width: 300px;
			flex-shrink: 0;
			display: flex;
			flex-direction: column;
			gap: 16px;
		}
		.patient-box,
		.history-box,
		.medicalRecord-detail {
			border: 1px solid #ccc;
			border-radius: 6px;
			padding: 14px;
			background: #fff;
		}
		.patient-box h2,
		.history-box h2,
		.medicalRecord-detail h2 {
			margin: 0 0 10px;
			font-size: 16px;
		}
		.patient-box table th {
			width: 95px;
		}
		/* 他の診療記録一覧 */
		.history-box {
			max-height: 360px;
			display: flex;
			flex-direction: column;
		}
		.history-list {
			list-style: none;
			margin: 0;
			padding: 0;
			overflow-y: auto;
		}
		.history-list li {
			margin-bottom: 4px;
		}
		.history-list li a {
			display: block;
			padding: 6px 8px;
			border-radius: 4px;
			text-decoration: none;
			color: inherit;
			border: 1px solid transparent;
		}
		.history-list li a:hover {
			background-color: #f5f7fa;
		}
		.history-list li.is-active a {
			background-color: #e8f0fe;
			border-color: #90b4f8;
			font-weight: bold;
		}
		.medicalRecord-date {
			display: block;
			font-size: 12px;
			color: #555;
		}
		.medicalRecord-disease {
			display: block;
			font-size: 14px;
		}
		/* 右側：診療記録詳細 */
		.medicalRecord-detail {
			flex: 1;
			min-width: 0;
		}
		.pre-wrap {
			white-space: pre-wrap;
			margin: 0;
		}
		.history-list li a,
		.current-record {
			display: block;
			padding: 6px 8px;
			border-radius: 4px;
		}
		
		.history-list li a {
			text-decoration: none;
			color: inherit;
			border: 1px solid transparent;
		}
		
		.history-list li a:hover {
			background-color: #f5f7fa;
		}
		
		/* 今開いている記録の見た目 */
		.current-record {
			background-color: #e8f0fe;
			border: 1px solid #90b4f8;
			font-weight: bold;
			color: #174ea6;
			cursor: default;
		}
		
		.current-badge {
			display: inline-block;
			margin-top: 4px;
			padding: 1px 6px;
			font-size: 11px;
			font-weight: normal;
			color: #fff;
			background-color: #1a73e8;
			border-radius: 3px;
		}
	</style>
</head>
<body>

<h1>診療記録詳細</h1>

<div class="top-nav">
	<!-- 処方箋有無が無しの記録にのみ表示 -->
	<a th:if="${!medicalRecord.hasPrescription}"
		th:href="@{処方箋側ができたら入力}">
		処方箋作成
	</a>
	
	<!-- MedicalRecordごと渡して、各入力欄に入力された状態になるようにする -->
	<a th:href="@{/medical-records/{id}/edit(id=${medicalRecord.medicalRecordId})}">
		編集する
	</a>
	
	<!-- 検索状態を復元するように色々持ってくる、渡す -->
	<a th:href="@{/medical-records/search(
		patientName=${searchMedicalRecordsDto.patientName},
		continuing=${searchMedicalRecordsDto.medicalTreatmentStatus},
		diseaseName=${searchMedicalRecordsDto.diseaseName},
		outcome=${searchMedicalRecordsDto.outcome}
	)}">
		戻る
	</a>
</div>

<div class="medicalRecord-viewer">

	<!-- 左サイドバー：左上（患者情報）＋ 左下（他の診療記録一覧） -->
	<aside class="sidebar">
		<!-- 左上：患者情報 -->
		<section class="patient-box">
			<h2>患者情報</h2>
			<table>
				<tr>
					<th colspan="2">基本情報</th>
				</tr>
				<tr>
					<th>患者ID</th>
					<td th:text="${patient.patientId}"></td>
				</tr>
				<tr>
					<th>病院ID</th>
					<td th:text="${patient.hospital.hospitalId}"></td>
				</tr>
				<tr>
					<th>氏名</th>
					<td th:text="${patient.name}"></td>
				</tr>
				<tr>
					<th>フリガナ</th>
					<td th:text="${patient.kata}"></td>
				</tr>
				<tr>
					<th>生年月日</th>
					<td th:text="${patient.birthDay}"></td>
				</tr>
				<tr>
					<th>性別</th>
					<td th:text="${patient.gender}"></td>
				</tr>

				<tr>
					<th colspan="2">身体情報</th>
				</tr>
				<tr>
					<th>血液型</th>
					<td th:text="${patient.bloodType}"></td>
				</tr>
				<tr>
					<th>RH</th>
					<td th:text="${patient.rh}"></td>
				</tr>
				<tr>
					<th>身長</th>
					<td th:text="${patient.height}"></td>
				</tr>
				<tr>
					<th>体重</th>
					<td th:text="${patient.weight}"></td>
				</tr>

				<tr>
					<th colspan="2">アレルギー情報</th>
				</tr>
				<tr th:if="${patient.allergy}">
					<th>アレルギー</th>
					<td>
						<!-- Listで受け取る場合は th:each でループ表示 -->
						<span th:text="${patient.allergy}"></span>
					</td>
				</tr>
				<tr th:unless="${patient.allergy}">
					<th>アレルギー</th>
					<td>なし</td>
				</tr>
			</table>
		</section>

		<!-- 左下：他の診療記録一覧 -->
		
		<section class="history-box">
			<h2>診療記録一覧</h2>
			<ul class="history-list" th:if="${!#lists.isEmpty(otherRecords)}">
				<li th:each="item : ${otherRecords}"
					th:classappend="${item.id == record.id} ? 'is-active' : ''">
					<!-- 他の記録：リンクあり -->
					<a th:if="${item.id != record.id}"
					th:href="@{/medical-records/{id}(id=${item.id})}">
						<span class="record-date" th:text="${item.recordDate}"></span>
					</a>
					
					<!-- 今開いている記録：リンクなし＋「（閲覧中）」表示 -->
					<div th:if="${item.id == record.id}" class="current-record">
						<span class="record-date" th:text="${item.recordDate}"></span>
						<span class="current-badge">閲覧中</span>
					</div>
				</li>
			</ul>
			<p th:if="${#lists.isEmpty(otherRecords)}">他の診療記録はありません。</p>
		</section>
	</aside>

	<!-- 右側：カルテ閲覧欄 -->
	<section class="medicalRecord-detail">
		<h2>診療記録内容</h2>
		<table>
			<tr>
				<th style="width: 110px;">傷病名</th>
				<td colspan="3" th:text="${medicalRecord.diseaseName}"></td>
			</tr>

			<tr>
				<th>転帰状況</th>
				<td style="width: 150px;" th:text="${medicalRecord.outcome}"></td>
				
				<th style="width: 100px;">
					転帰日
				</th>
				<td style="width: 150px;" th:text="${medicalRecord.outcomeDate}"></td>
			</tr>

			<tr>
				<th colspan="4">経過</th>
			</tr>

			<tr class="label-row">
				<td style="width: 25%;">Subject</td>
				<td style="width: 25%;">Object</td>
				<td style="width: 25%;">Assessment</td>
				<td style="width: 25%;">Plan</td>
			</tr>

			<tr class="value-row">
				<td><p class="pre-wrap" th:text="${medicalRecord.progressS}"></p></td>
				<td><p class="pre-wrap" th:text="${medicalRecord.progressO}"></p></td>
				<td><p class="pre-wrap" th:text="${medicalRecord.progressA}"></p></td>
				<td><p class="pre-wrap" th:text="${medicalRecord.progressP}"></p></td>
			</tr>

			<tr class="label-row">
				<td colspan="4">処置</td>
			</tr>
			<tr class="value-row">
				<td colspan="4"><p class="pre-wrap" th:text="${medicalRecord.procedure}"></p></td>
			</tr>

			<tr>
				<th>再診予定日</th>
				<td th:text="${medicalRecord.followUpDate}"></td>
				<th>処方箋の有無</th>
				<td th:text="${medicalRecord.hasPrescription} ? '有' : '無'"></td>
			</tr>
		</table>
	</section>

</div>

</body>
</html>
