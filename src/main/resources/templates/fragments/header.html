
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>

    <header class="app-header" th:fragment="header">

        <!-- システム名 -->
        <div class="header-system-name">
            Tasukarte
        </div>

        <!-- 病院名 -->
        <div class="header-hospital-name"
             th:text="${hospitalName}">
            〇〇病院
        </div>

        <!-- ユーザー名 -->
        <div class="header-user-name"
             th:text="${userName}">
            ユーザー名
        </div>

        <!-- ログアウト -->
        <div class="header-logout">
            ログアウト
        </div>

        <link rel="stylesheet"
              href="../../static/css/header.css"
              th:href="@{/css/header.css}">

    </header>

</body>
</html>
