<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>紹介状作成</title>
</head>
<body>

<form th:action="@{/referrals/input}" method="post">

	<!-- ThymeleafによるURL生成、jsで利用 -->
	<div id="referralSearchConfig"
    	 th:attr="data-patient-url=@{/referrals/search/patients},
        	      data-hospital-url=@{/referrals/search/hospitals}">
	</div>

	<div class="form-group">
    	<label for="patientName">患者名</label>
    	<input type="text"
        	   id="patientName"
	           placeholder="患者名を入力してください"
	           autocomplete="off">

    	<!-- 選択された患者IDを保持 -->
    	<input type="hidden"
          	 id="patientId"
          	 name="patientId">

    	<!-- 検索候補を表示 -->
    	<div id="patientSuggestions"></div>
	</div>

	<div class="form-group">
    	<label for="recipientHospitalName">宛先病院</label>
    	<input type="text"
        	   id="recipientHospitalName"
        	   placeholder="病院名を入力してください"
        	   autocomplete="off">

    	<!-- 選択された病院IDを保持 -->
    	<input type="hidden"
        	   id="recipientHospitalId"
        	   name="recipientHospitalId">

    	<!-- 検索候補を表示 -->
    	<div id="hospitalSuggestions"></div>
	</div>

<!--エラーメッセージ用-->
<p th:if="${errorMessage != null}"
   th:text="${errorMessage}"
   style="color: red;"></p>
   
	<!-- 次へ -->
	<button type="submit">次へ</button>

</form>
<script th:src="@{/js/referral/referralCreate.js}"></script>
</body>
</html>
