
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>患者情報検索</title>
</head>
<body>

    <h1>患者情報一覧</h1>

    <a th:href="@{/patients/new}">
        +新規登録
    </a>

    <form th:action="@{/patients/search}" method="get">

        <h3>絞り込み内容</h3>

        <p>
            氏名：
            <input type="text" id="patientName" name="name" placeholder="例：山本隆之">
        </p>
        
        <p> 
            性別：
            <input type="radio" id="man" name="gender" value="1">
            <label for="man">男</label>

            <input type="radio" id="woman" name="gender" value="2">
            <label for="woman">女</label>
        </p>
        
        <p>
            登録日：
            <input type="date" name="startDate">
            ～
            <input type="date" name="endDate">
        </p>

<!--        <p>-->
<!--            再診予定日：-->
<!--            <input type="date" name="startNextVisitDate">-->
<!--            ～-->
<!--            <input type="date" name="endNextVisitDate">-->
<!--        </p>-->

<!--		<p>-->

<!--            最終診療日：-->
<!--            <input type="date" name="startLastVisitDate">-->
<!--            ～-->
<!--            <input type="date" name="endLastVisitDate">-->
<!--        </p>-->

        <p>
            年齢：
            <input type="number" name="age" min="0" max="150">
        </p>

        <button type="submit">検索</button>

    </form>

    <h2>患者一覧</h2>

    <table border="1">
        <thead>
            <tr>
                <th>氏名</th>
                <th>性別</th>
                <th>年齢</th>
                <th>登録日</th>
                
<!--                 最新の診療記録から取得する予定 -->
<!--                <th>再診予定日</th>-->
<!--                <th>最終診療日</th>-->
                
<!--                一覧を表示後作成に取り掛かる-->
<!--                <th>紹介状作成</th>-->
<!--                <th>問診票作成</th>-->
<!--                <th>診療記録作成</th>-->
<!--                <th>患者情報変更</th>-->
            </tr>
        </thead>

        <tbody>
            <tr th:if="${#lists.isEmpty(patients)}">
                <td colspan="10">
                    検索を行ってください
                </td>
            </tr>

            <!-- 検索結果の表示部分 -->
            <tr th:each="patient : ${patients}">
                <td th:text="${patient.name}"></td>
                <td th:text="${patient.gender}"></td>
                <td th:text="${patient.age}"></td>
                <td th:text="${patient.createdAt}"></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
