<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>職員一覧</title>
</head>

<body>

	<h1>職員一覧</h1>

	<!-- 登録ボタン -->
	<a th:href="@{/staff/new}" th:if="${isAdmin}">登録</a>

	<!-- 戻るボタン -->
	<a href="/top">トップページへ</a>

	<!-- 検索フォーム -->
	<form th:action="@{/staff}" method="get">

		<!-- 氏名 -->
		<label>氏名：</label>
		<input type="text" name="name" required>

		<!-- 性別 -->
		<p>性別：</p>
		<label>
			<input type="radio" name="gender" value="0"> その他
		</label>
		<label>
			<input type="radio" name="gender" value="1"> 男
		</label>
		<label>
			<input type="radio" name="gender" value="2"> 女
		</label>

		<!-- 役職 -->
		<p>役職：</p>
		<label>
			<input type="radio" name="position" value="1"> 医者
		</label>
		<label>
			<input type="radio" name="position" value="2"> 医療事務
		</label>
		<label>
			<input type="radio" name="position" value="3"> 看護師
		</label>

		<!-- 権限 -->
		<p>権限：</p>
		<select name="role">
			<option value="">選択してください</option>
			<option value="1">一般</option>
			<option value="2">院内システム管理者</option>
		</select>

		<!-- 登録状況 -->
		<p>登録状況：</p>
		<select name="is_deleted">
			<option value="">選択してください</option>
			<option value="false">在籍</option>
			<option value="true">退職</option>
		</select>

		<button type="submit">検索</button>

	</form>

	<!-- 職員一覧 -->
	<h2>職員一覧</h2>

	<!-- 職員一覧テーブル -->
	<table border="1">
		<thead>
			<tr>
				<th>氏名</th>
				<th>性別</th>
				<th>役職</th>
				<th th:if="${isAdmin}">操作</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="staff : ${staffList}">
				<td th:text="${staff.nameKanji}"></td>
				<td th:switch="${staff.gender}">
					<span th:case="0">その他</span>
					<span th:case="1">男</span>
					<span th:case="2">女</span>
				</td>
				<td th:text="${staff.positionName}"></td>
				<td th:if="${isAdmin}">
					<a th:href="@{/staff/{staffId}(staffId=${staff.staffId})}">確認</a>
					<a href="#">編集</a>
					<a href="#">削除</a>
				</td>
			</tr>
		</tbody>
	</table>

</body>

</html>
