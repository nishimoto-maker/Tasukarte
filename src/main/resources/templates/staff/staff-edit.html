<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>職員情報編集</title>
</head>

<body>

	<h1>職員情報編集</h1>

	<form th:action="@{/staff/{staffId}/edit(staffId=${staffEditDto.staffId})}" th:object="${staffEditDto}"
		method="post">

		<!-- 職員ID -->
		<div>
			<label>職員ID</label>
			<span th:text="*{staffId}"></span>
			<input type="hidden" th:field="*{staffId}">
		</div>

		<!-- 職員名（漢字） -->
		<div>
			<label>氏名（漢字）</label>
			<input type="text" th:field="*{nameKanji}" required maxlength="50">
			<p th:errors="*{nameKanji}"></p>
		</div>

		<!-- 職員名（カナ） -->
		<div>
			<label>氏名（カナ）</label>
			<input type="text" th:field="*{nameKana}" required maxlength="50">
			<p th:errors="*{nameKana}"></p>
		</div>

		<!-- 性別 -->
		<div>
			<label>性別</label>
			<label>
				<input type="radio" th:field="*{gender}" value="0" required>
				その他
			</label>
			<label>
				<input type="radio" th:field="*{gender}" value="1">
				男性
			</label>
			<label>
				<input type="radio" th:field="*{gender}" value="2">
				女性
			</label>
			<p th:errors="*{gender}"></p>
		</div>

		<!-- 住所 -->
		<div>
			<label>住所</label>
			<input type="text" th:field="*{address}" required maxlength="255">
			<p th:errors="*{address}"></p>
		</div>

		<!-- 郵便番号 -->
		<div>
			<label>郵便番号</label>
			<input type="text" th:field="*{postCode}" required maxlength="7">
			<p th:errors="*{postCode}"></p>
		</div>

		<!-- 電話番号 -->
		<div>
			<label>電話番号</label>
			<input type="text" th:field="*{phoneNumber}" required maxlength="20">
			<p th:errors="*{phoneNumber}"></p>
		</div>

		<!-- メールアドレス -->
		<div>
			<label>メールアドレス</label>
			<input type="email" th:field="*{emailAddress}" required maxlength="254">
			<p th:errors="*{emailAddress}"></p>
		</div>

		<!-- 役職 -->
		<div>
			<label>役職</label>
			<div th:each="position : ${positionList}">
				<label>
					<input type="radio" th:field="*{positionId}" th:value="${position.positionId}" required>
					<span th:text="${position.positionName}"></span>
				</label>
			</div>
			<p th:errors="*{positionId}"></p>
		</div>

		<!-- 権限 -->
		<div>
			<label>権限</label>
			<select th:field="*{roleId}" required>
				<option value="">選択してください</option>
				<option th:each="role : ${roleList}" th:value="${role.roleId}" th:text="${role.roleName}">
				</option>
			</select>
			<p th:errors="*{roleId}"></p>
		</div>

		<!-- 登録状況 -->
		<div>
			<label>登録状況</label>
			<select th:field="*{isDeleted}" required>
				<option value="false">在籍</option>
				<option value="true">退職</option>
			</select>
			<p th:errors="*{isDeleted}"></p>
		</div>

		<!-- ボタン -->
		<div>
			<a th:href="@{/staff}">戻る</a>
			<button type="submit">変更</button>
		</div>

		<p th:if="${editError}" th:text="${editError}"></p>

	</form>

</body>

</html>
