<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>職員情報確認</title>
</head>

<body>
	<h1>職員情報確認</h1>

	<table border="1">
		<tr>
			<th>職員ID</th>
			<td th:text="${staffDetail.staffId}"></td>
		</tr>
		<tr>
			<th>氏名（漢字）</th>
			<td th:text="${staffDetail.nameKanji}"></td>
		</tr>
		<tr>
			<th>氏名（カナ）</th>
			<td th:text="${staffDetail.nameKana}"></td>
		</tr>
		<tr>
			<th>性別</th>
			<td th:switch="${staffDetail.gender}">
				<span th:case="0">その他</span>
				<span th:case="1">男</span>
				<span th:case="2">女</span>
			</td>
		</tr>
		<tr>
			<th>住所</th>
			<td th:text="${staffDetail.address}"></td>
		</tr>
		<tr>
			<th>郵便番号</th>
			<td th:text="${staffDetail.postCode}"></td>
		</tr>
		<tr>
			<th>電話番号</th>
			<td th:text="${staffDetail.phoneNumber}"></td>
		</tr>
		<tr>
			<th>メールアドレス</th>
			<td th:text="${staffDetail.emailAddress}"></td>
		</tr>
		<tr>
			<th>役職</th>
			<td th:text="${staffDetail.positionName}"></td>
		</tr>
		<tr>
			<th>権限</th>
			<td th:text="${staffDetail.roleName}"></td>
		</tr>
		<tr>
			<th>登録状況</th>
			<td th:if="${staffDetail.isDeleted}">退職</td>
			<td th:unless="${staffDetail.isDeleted}">在籍</td>
		</tr>
	</table>

	<a th:href="@{/staff}">職員一覧へ戻る</a>

</body>

</html>
